// Measure remote reuse without a local task cache or the upstream cache service.
gradle.settingsEvaluated { settings ->
    settings.buildCache {
        local { enabled = false }
        if (!System.getenv('BORINGCACHE_GRADLE_CACHE_URL')) {
            remote { enabled = false }
        }
    }
}
